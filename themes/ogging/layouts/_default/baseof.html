<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "ko" }}" data-theme="dark">
<head>
{{ partial "head.html" . }}
{{ partial "analytics.html" . }}
</head>
<body class="{{ if .IsHome }}view-home{{ else if .IsPage }}view-article{{ else }}view-list{{ end }}">
<div class="scroll-progress"><div id="progress-bar"></div></div>
{{ partial "header.html" . }}
<main class="site-main">
  {{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "palette.html" . }}
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: 'dark', securityLevel: 'loose' });
</script>
{{ end }}
</body>
</html>
