<header class="site-header">
  <div class="site-header__inner">
    <a href="{{ site.BaseURL }}" class="wordmark" aria-label="{{ site.Title }} 홈">
      <span>{{ site.Title }}</span>
      <span class="wordmark__cursor" aria-hidden="true"></span>
      <span class="wordmark__mono">/ {{ site.Params.wordmarkSuffix | default "ogging.dev" }}</span>
    </a>
    <nav class="site-nav" id="site-nav">
      {{ $current := .RelPermalink }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" {{ if or (eq $current .URL) (and (eq .URL "/") $.IsHome) }}class="is-active"{{ end }}>{{ .Name }}</a>
      {{ else }}
        <a href="/" {{ if .IsHome }}class="is-active"{{ end }}>Home</a>
        <a href="/archives/">Archives</a>
        <a href="/tags/">Tags</a>
        <a href="/about/">About</a>
      {{ end }}
    </nav>
    <div class="header-tools">
      <button class="search-btn" id="search-btn" type="button" aria-label="검색 열기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-btn__label">검색</span>
        <kbd>⌘K</kbd>
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="메뉴 열기/닫기" aria-controls="site-nav" aria-expanded="false">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
    </div>
  </div>
</header>
