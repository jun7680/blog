{{ with site.Params.goatcounter }}{{ with .code }}
<div class="card">
  <div class="card__head">
    <span class="card__title">VISITORS</span>
  </div>
  <div class="gc-total">
    <span class="gc-total__label">누적 방문자</span>
    <span class="gc-total__value" id="gc-total">—</span>
  </div>
  <script>
    (function () {
      var base = 'https://{{ . | safeJS }}.goatcounter.com/counter/TOTAL.json';
      fetch(base, { credentials: 'omit' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var el = document.getElementById('gc-total');
          if (!el) return;
          el.textContent = (d && d.count) ? d.count : '0';
        })
        .catch(function () {
          var el = document.getElementById('gc-total');
          if (el) el.textContent = '—';
        });
    })();
  </script>
</div>
{{ end }}{{ end }}
