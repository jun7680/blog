{{ with site.Params.goatcounter }}{{ with .code }}
<div class="card">
  <div class="card__head">
    <span class="card__title">VISITORS</span>
  </div>
  <div class="gc-stats">
    <div class="gc-stat">
      <span class="gc-stat__label">오늘</span>
      <span class="gc-stat__value" id="gc-today">—</span>
    </div>
    <div class="gc-stat">
      <span class="gc-stat__label">누적</span>
      <span class="gc-stat__value" id="gc-total">—</span>
    </div>
  </div>
  <script>
    (function () {
      var site = {{ . | jsonify }};
      var base = 'https://' + site + '.goatcounter.com/counter/TOTAL.json';
      var today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());

      function load(url, id) {
        fetch(url, { credentials: 'omit' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            var el = document.getElementById(id);
            if (!el) return;
            el.textContent = (d && d.count) ? d.count : '0';
          })
          .catch(function () {
            var el = document.getElementById(id);
            if (el) el.textContent = '—';
          });
      }

      load(base, 'gc-total');
      load(base + '?start=' + today + '&end=' + today, 'gc-today');
    })();
  </script>
</div>
{{ end }}{{ end }}
