{{ $a := site.Params.author }}
<section class="side-section" id="about">
  <h2 class="side-section__title">ABOUT</h2>
  <h3 class="about__name">{{ $a.name | default site.Title }}</h3>
  {{ with $a.role }}<p class="about__role">{{ . }}</p>{{ end }}
  <pre class="about-ascii">┌─────────────────┐
│ <b>오깅중 / og_</b>   │
│ <i>████████░░</i> 80% │
│ status: typing  │
└─────────────────┘</pre>
  {{ with $a.bio }}<p class="about__bio">{{ . | safeHTML }}</p>{{ end }}
</section>
