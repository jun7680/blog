{{ with site.Params.now }}
<div class="card">
  <div class="card__head">
    <span class="card__title">NOW</span>
    <span class="now-aux"><span class="live-dot"></span> LIVE</span>
  </div>
  <div class="now-list">
    {{ range . }}
      <div><span class="now-label">{{ .label }}_</span> {{ .text }}</div>
    {{ end }}
  </div>
</div>
{{ end }}
