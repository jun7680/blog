{{ $tags := site.Taxonomies.tags }}
{{ if $tags }}
<section class="side-section" id="tags">
  <h2 class="side-section__title">TAGS · {{ len $tags }}</h2>
  <div class="side-tags">
    {{ range first 12 $tags.ByCount }}
      <a class="tag" href="{{ .Page.RelPermalink }}">#{{ .Term }} <span>{{ .Count }}</span></a>
    {{ end }}
  </div>
</section>
{{ end }}
