baseURL: https://jun7680.github.io
defaultContentLanguage: ko
hasCJKLanguage: true
title: 오깅중
theme: ogging
pagination:
  pagerSize: 8

permalinks:
  post: /p/:slug/
  page: /:slug/

outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark
    lineNos: false
    codeFences: true
  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 2

menu:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Archives
      url: /archives/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: Categories
      url: /categories/
      weight: 40
    - name: About
      url: /about/
      weight: 50
  footer:
    - name: About
      url: /about/
      weight: 10
    - name: Privacy
      url: /privacy/
      weight: 20

params:
  description: iOS, Swift, 그리고 가끔 다른 것들. 개발 일지와 새로 배운 것들.
  wordmarkSuffix: ogging.dev
  mainSections:
    - post
  startYear: 2020
  footerLine: |
    iOS, Swift, 그리고 가끔 다른 것들. <br/>
    "Don't worry if it doesn't work right."

  author:
    name: 오깅중
    role: iOS Developer · Swift
    bio: |
      "Don't worry if it doesn't work right. If everything did, you'd be out of a job."
      — iOS와 Swift에 대한 기록.

  social:
    - name: GitHub
      url: https://github.com/jun7680
    - name: Instagram
      url: https://instagram.com/ockkkk91
    - name: Email
      url: mailto:dlswns9119@gmail.com

  now:
    - label: reading
      text: '"Modern Concurrency in Swift"'
    - label: building
      text: SwiftUI side project
    - label: listening
      text: lo-fi beats / focus

