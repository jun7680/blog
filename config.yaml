baseURL: https://jun7680.github.io
defaultContentLanguage: ko
hasCJKLanguage: true
title: 오깅중
theme: ogging
pagination:
  pagerSize: 8

permalinks:
  post: /p/:slug/
  page: /:slug/

outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark
    lineNos: false
    codeFences: true
  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 2

menu:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Archives
      url: /archives/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: Categories
      url: /categories/
      weight: 40
    - name: About
      url: /about/
      weight: 50
  footer:
    - name: About
      url: /about/
      weight: 10
    - name: Privacy
      url: /privacy/
      weight: 20

params:
  description: iOS, Swift, 그리고 가끔 다른 것들. 개발 일지와 새로 배운 것들.
  wordmarkSuffix: ogging.dev
  mainSections:
    - post
  startYear: 2020
  footerLine: |
    iOS, Swift, 그리고 가끔 다른 것들. <br/>
    "Don't worry if it doesn't work right."

  author:
    name: 오깅중
    role: iOS Developer · Swift
    bio: |
      "Don't worry if it doesn't work right. If everything did, you'd be out of a job."
      — iOS와 Swift에 대한 기록.

  social:
    - name: GitHub
      url: https://github.com/jun7680
    - name: Instagram
      url: https://instagram.com/ockkkk91
    - name: Email
      url: mailto:dlswns9119@gmail.com

  now:
    - label: reading
      text: '"Modern Concurrency in Swift"'
    - label: building
      text: SwiftUI side project
    - label: listening
      text: lo-fi beats / focus

  # Google Analytics 4 측정 ID (G-XXXXXXXXXX)
  # https://analytics.google.com → 관리 → 데이터 스트림에서 발급.
  # 비워두면 비활성화. hugo server 로컬 개발 시 자동 비활성화.
  googleAnalytics: "G-7FMQW3EVSB"

  # Google Search Console 사이트 소유권 메타 검증 코드(content 값만).
  # https://search.google.com/search-console → 속성 추가 → HTML 태그.
  # 비워두면 메타 미출력.
  siteVerification: ""

  # GoatCounter 방문자 카운터
  # https://www.goatcounter.com/signup → site code 받음(예: ogging → "ogging.goatcounter.com")
  # 가입 후 Settings → "Allow adding visitor counts on your website" 체크해야 위젯 동작.
  # 비워두면 비콘·사이드바 카운터 모두 비활성. hugo server 로컬 개발 시에도 자동 비활성.
  goatcounter:
    code: "ogging"

  adsense:
    # AdSense 활성화 절차:
    # 1) https://adsense.google.com → 신청 → 사이트에 https://jun7680.github.io 등록
    # 2) 발급된 게시자 ID(ca-pub-XXXX)를 client에 입력 → 배포
    #    → 이때 광고는 안 켜도 됨. client만 있으면 head에 google-adsense-account 메타 + asynchronous 로더 스크립트가 자동 삽입돼서 AdSense 크롤러가 사이트 인증 가능.
    # 3) 승인 후 광고 단위를 만들면 slot 값을 받음. enabled: true + slot 입력하면 sidebar/본문에 광고가 노출 (sidebar/index.html의 adsense partial 주석 해제 필요).
    # 4) ads.txt는 승인 직후 AdSense 대시보드가 안내 → static/ads.txt로 추가.
    # placeholder는 미리보기/개발용 — 평소엔 false 유지.
    enabled: false
    placeholder: false
    client: ""
    slot: ""
